name: Phase 1 Android release build

# Optional repository secrets for a production-signed APK:
#   ANDROID_SIGNING_PROPERTIES_BASE64 - base64 of android/signing.properties;
#     the file must use storeFile=keystore/ci-release.p12
#   ANDROID_KEYSTORE_BASE64 - base64 of the matching .p12 keystore
# If either secret is absent, this workflow builds an unsigned release APK and
# says so in the job log. No other secret names are used.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-android'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Capacitor
        run: npm run build:android

      - name: Configure release signing
        env:
          ANDROID_SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_SIGNING_PROPERTIES_BASE64:-}" && -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            mkdir -p android/keystore
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/ci-release.p12
            printf '%s' "$ANDROID_SIGNING_PROPERTIES_BASE64" | base64 --decode > android/signing.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            cat > android/signing.properties <<'EOF'
          storeFile=keystore/ci-release.p12
          storePassword=unused
          keyAlias=unused
          keyPassword=unused
          EOF
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::notice::Signing secrets are not both configured; building an unsigned release APK."
          fi

      - name: Build release APK
        run: |
          set -euo pipefail
          cd android
          if [[ "${SIGNED:-false}" == "true" ]]; then
            bash ./gradlew --no-daemon :app:assembleRelease
          else
            bash ./gradlew --no-daemon :app:packageRelease
          fi

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          if [[ "${SIGNED:-false}" == "true" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-artifact/
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-artifact/
          fi
          (cd release-artifact && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release-artifact
          if-no-files-found: error
          retention-days: 30
