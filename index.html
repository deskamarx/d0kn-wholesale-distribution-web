<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14245c" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("d0kn-distribution-theme-v1");
          var dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", dark ? "#080d1c" : "#14245c");
          var prefs = JSON.parse(localStorage.getItem("d0kn-distribution-preferences-v1") || "{}");
          document.documentElement.dataset.accent = ["indigo", "violet", "teal", "amber", "rose"].indexOf(prefs.accent) >= 0 ? prefs.accent : "indigo";
          document.documentElement.dataset.density = prefs.density === "compact" ? "compact" : "relaxed";
          document.documentElement.dataset.fontScale = ["small", "normal", "large"].indexOf(prefs.fontScale) >= 0 ? prefs.fontScale : "normal";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="D0K@N Global Distribution command center for China sourcing, import logistics, warehouse stock, wholesale orders, receivables, compliance, and intelligent operations." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="D0K@N Global" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>D0K@N Global Distribution — Wholesale & Import Command Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
